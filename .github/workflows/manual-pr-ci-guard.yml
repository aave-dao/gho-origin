name: manual-pr-ci-guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    name: Manual PR CI covers all PR workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every PR workflow is referenced in manual-pr-ci.yml
        run: |
          status=0
          for f in .github/workflows/*.yml; do
            name="$(basename "$f")"
            [[ "$name" == manual-pr-ci* ]] && continue
            grep -q 'pull_request' "$f" || continue
            if ! grep -qF "$name" .github/workflows/manual-pr-ci.yml; then
              echo "::error file=$f::$name runs on PRs but is not referenced in manual-pr-ci.yml"
              status=1
            fi
          done
          exit $status
